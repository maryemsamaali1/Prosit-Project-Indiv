spring.application.name=gateway
server.port=8090

# Eureka Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Candidature Microservice (Route statique sur port 8086)
spring.cloud.gateway.mvc.routes[0].id=candidature
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8086
spring.cloud.gateway.mvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[0].predicates[0].args.patterns=/mic3/candidature/**

# Candidat Microservice (Route dynamique via Eureka -> port 8081)
spring.cloud.gateway.mvc.routes[1].id=candidat
spring.cloud.gateway.mvc.routes[1].uri=lb://candidat
spring.cloud.gateway.mvc.routes[1].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[1].predicates[0].args.patterns=/mic1/candidates/**

# Job Microservice (Route dynamique via Eureka -> port 8082)
spring.cloud.gateway.mvc.routes[2].id=job
spring.cloud.gateway.mvc.routes[2].uri=lb://JOB
spring.cloud.gateway.mvc.routes[2].predicates[0].name=Path
spring.cloud.gateway.mvc.routes[2].predicates[0].args.patterns=/api/jobs/**

# Logs de routage et Load Balancer
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=TRACE